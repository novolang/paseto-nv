[package]
name        = "paseto-nv"
version     = "0.0.1"
description = "PASETO v4 — local over XChaCha20 with a BLAKE2b MAC, public over Ed25519 — and PASERK key serialisation, with the unverified state unusable by construction: decoding hands back a token whose claims cannot be read until a key and a policy have produced a verified one.  There is no algorithm field to confuse, because the version and the purpose are a fixed prefix and the key carries its own purpose.  Interface only — every body is a todo()."
license     = "Apache-2.0"

# An INTERFACE release: every `pub fn` body is a `todo()`, so the
# signatures and the effect rows are published and nothing is
# implemented.  `novo pkg publish` recognises the shape and requires
# both the draft stability and the 0.0.x version; the first
# implementation is the 0.1.0 published over it.
stability   = "draft"

# `core`.  Verifying a token needs the current time and a `core`
# package may not read a clock, so an instant arrives as a PARAMETER —
# jwt-nv's `JwtInstant` under this package's name, and the same shape
# sql-engine-nv's `NowSnapshot` takes.  The 32 random bytes v4.local
# needs are the caller's too, for the same reason: a `core` package has
# no `[rand]` row, and the effect is better spent once in the host
# where a reviewer can see it.
#
# No device claim and no `tests/embedded_probe.nv`: the surface is
# `Str`, `Bytes` and lists of claims.  chacha20-nv underneath makes the
# device claim; this does not.
layer       = "core"

category    = "web"

tags        = ["paseto", "paserk", "token", "auth", "v4", "xchacha20", "ed25519", "web"]
repository  = "https://github.com/novolang/paseto-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "PASETO v4, with no algorithm field to confuse"

[dependencies]
# chacha20-nv supplies XChaCha20 — the RAW stream cipher, not the
# Poly1305 AEAD.  v4.local is encrypt-then-MAC with BLAKE2b, so it uses
# `cc20x.xapply_into`, which chacha20-nv publishes separately with the
# warning that it authenticates nothing.  This package is the caller
# that means it.
#
# A PATH DEPENDENCY, and it must become `chacha20-nv = "^0.0.1"` before
# publish: `novo pkg publish` refuses a path at the line it is written
# on, because the tarball would carry it and send every consumer to a
# directory that is not on their machine.
chacha20-nv = "^0.0.1"

# ed25519-nv supplies v4.public's signing and verification, and its key
# types are the ones this package's `PasSecretKey` and `PasPublicKey`
# hold.  Taking them rather than declaring a second pair is why a
# caller that generated a key pair with `key_pair_from_seed` hands it
# straight to `paserk`.
ed25519-nv = "^0.0.1"

# calendar-nv parses and formats the RFC 3339 timestamps the registered
# claims `exp`, `nbf` and `iat` are written as.  PASETO specifies RFC
# 3339 strings rather than JWT's numeric seconds, so a parser is not
# optional here the way it is there — and `CivilDateTime` is
# calendar-nv's type, so a caller comparing a claim against its own
# clock is comparing two values of one type.
calendar-nv = "^0.0.2"

# base64-nv encodes every part of a token.  PASETO is base64url
# UNPADDED throughout, which is one of base64-nv's four combinations
# and the one it named JWT for.
base64-nv = "^0.0.1"
