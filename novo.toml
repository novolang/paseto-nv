[package]
name        = "paseto-nv"
version     = "0.1.0"
description = "PASETO v4 — local over XChaCha20 with a BLAKE2b MAC, public over Ed25519 — and PASERK key serialisation, with the unverified state unusable by construction: decoding hands back a token whose claims cannot be read until a key and a policy have produced a verified one.  There is no algorithm field to confuse, because the version and the purpose are a fixed prefix and the key carries its own purpose."
license     = "Apache-2.0"

stability   = "experimental"

# `core`.  Verifying a token needs the current time and a `core`
# package may not read a clock, so an instant arrives as a PARAMETER —
# jwt-nv's `JwtInstant` under this package's name, and the same shape
# sql-engine-nv's `NowSnapshot` takes.  The 32 random bytes v4.local
# needs are the caller's too, for the same reason: a `core` package has
# no `[rand]` row, and the effect is better spent once in the host
# where a reviewer can see it.
#
# No device claim and no `tests/embedded_probe.nv`: the surface is
# `Str`, `Bytes` and lists of claims.
layer       = "core"

category    = "web"

tags        = ["paseto", "paserk", "token", "auth", "v4", "xchacha20", "ed25519", "web"]
repository  = "https://github.com/novolang/paseto-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.22.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "PASETO v4, with no algorithm field to confuse"

[dependencies]
# blake2-nv supplies keyed BLAKE2b: the two subkeys of v4.local, its
# tag and the PASERK key identifiers are all calls to
# `b2bytes.blake2b_keyed_into` or `blake2b_full_into`.
blake2-nv = "^0.1"

# chacha20-nv supplies XChaCha20, the raw stream cipher and not the
# Poly1305 AEAD.  v4.local is encrypt-then-MAC with BLAKE2b, so it uses
# `cc20x.xapply_into`, which authenticates nothing.
chacha20-nv = "^0.1"

# ed25519-nv supplies v4.public's signing and verification, and its key
# types are the ones this package's `PasSecretKey` and `PasPublicKey`
# hold.
ed25519-nv = "^0.1"

# calendar-nv parses and formats the RFC 3339 timestamps that the
# registered claims `exp`, `nbf` and `iat` are written as.
calendar-nv = "^0.2.0"

# base64-nv encodes every part of a token.  PASETO is base64url without
# padding throughout.
base64-nv = "^0.1.1"

# crypto-nv supplies `digest.ct_eq`, the constant-time comparison of a
# MAC and of a PASERK identifier.
crypto-nv = "^0.1.7"
